<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F.R.I.D.A.Y. - AI Assistant OS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #050b14;
        color: #00ffff;
        font-family: "Courier New", Courier, monospace;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      /* 智慧適配：自動根據任何視窗大小調整佔比 */
      .os-container {
        width: 94vw;
        height: 94vh;
        max-width: 1600px;
        max-height: 950px;
        background: rgba(0, 20, 40, 0.85);
        border: 2px solid #00ffff;
        box-shadow:
          0 0 30px rgba(0, 255, 255, 0.25),
          inset 0 0 20px rgba(0, 255, 255, 0.1);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        padding: 20px;
      }
      .os-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px dashed #00ffff;
        padding-bottom: 12px;
        margin-bottom: 15px;
        font-size: 1.25rem;
        letter-spacing: 2px;
      }
      .status-indicator {
        font-size: 0.9rem;
        color: #00ffcc;
      }
      /* 系統動態狀態列 */
      .core-status-bar {
        background: rgba(0, 255, 255, 0.08);
        border: 1px solid #00ffff;
        padding: 10px 15px;
        margin-bottom: 15px;
        border-radius: 6px;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .waveform {
        display: inline-block;
        letter-spacing: 3px;
        color: #00ffff;
        opacity: 0.4;
      }
      .waveform.active {
        animation: pulse 1s infinite alternate;
        opacity: 1;
      }
      @keyframes pulse {
        0% {
          opacity: 0.3;
        }
        100% {
          opacity: 1;
          text-shadow: 0 0 8px #00ffff;
        }
      }
      /* 聊天紀錄卷軸區塊 (自動填滿剩餘高度並支援隨視窗延展) */
      .chat-box {
        flex: 1;
        background: rgba(0, 5, 10, 0.7);
        border: 1px solid rgba(0, 255, 255, 0.3);
        border-radius: 6px;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 15px;
      }
      .message {
        padding: 12px 16px;
        border-radius: 8px;
        max-width: 75%;
        line-height: 1.6;
        font-size: 1rem;
        word-break: break-all;
      }
      .message.user {
        background: rgba(0, 150, 255, 0.2);
        border: 1px solid #0099ff;
        align-self: flex-end;
        color: #ffffff;
      }
      .message.friday {
        background: rgba(0, 255, 255, 0.1);
        border: 1px solid #00ffff;
        align-self: flex-start;
        color: #00ffff;
      }
      /* 底部輸入列 */
      .input-area {
        display: flex;
        gap: 12px;
      }
      .input-area input {
        flex: 1;
        background: rgba(0, 10, 20, 0.95);
        border: 1px solid #00ffff;
        color: #00ffff;
        padding: 14px 18px;
        border-radius: 6px;
        font-size: 1rem;
        outline: none;
        font-family: "Courier New", Courier, monospace;
      }
      .input-area input:focus {
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
      }
      .input-area button {
        background: #00ffff;
        color: #050b14;
        border: none;
        padding: 0 30px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
        font-family: "Courier New", Courier, monospace;
      }
      .input-area button:hover {
        background: #00b3b3;
        box-shadow: 0 0 12px #00ffff;
      }
    </style>
  </head>
  <body>
    <div class="os-container">
      <!-- 頂部標題列 -->
      <div class="os-header">
        <span>F.R.I.D.A.Y. OS (Adaptive UI)</span>
        <span class="status-indicator" id="hostStatus">● HOST CONNECTED</span>
      </div>

      <!-- 系統動態狀態列 -->
      <div class="core-status-bar">
        <span id="coreStatus">核心待命：等待語音或指令輸入...</span>
        <span class="waveform" id="waveform">IIIIIIII</span>
      </div>

      <!-- 聊天訊息卷軸區 -->
      <div class="chat-box" id="chatBox">
        <div class="message friday">
          <strong>F.R.I.D.A.Y.：</strong
          >系統初始化完畢。主人，請問今天想聊些什麼或記錄什麼任務？
        </div>
      </div>

      <!-- 底部輸入列 -->
      <div class="input-area">
        <input
          type="text"
          id="userInput"
          placeholder="與 Friday 對話或輸入「幫我記...」"
          autofocus
        />
        <button
          type="button"
          onclick="
            event.preventDefault();
            sendMessage();
          "
        >
          執行
        </button>
      </div>
    </div>

    <script>
      const inputField = document.getElementById("userInput");

      // 監聽鍵盤事件，確保按 Enter 能正確送出且不重新整理頁面
      inputField.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault(); // 絕對阻止預設表單行為
          sendMessage();
        }
      });

      async function sendMessage() {
        const chatBox = document.getElementById("chatBox");
        const waveform = document.getElementById("waveform");
        const coreStatus = document.getElementById("coreStatus");
        const text = inputField.value.trim();

        if (!text) return;

        // 立即顯示使用者訊息
        chatBox.innerHTML += `<div class="message user"><strong>您：</strong> ${text}</div>`;
        inputField.value = ""; // 清空輸入框
        chatBox.scrollTop = chatBox.scrollHeight;

        waveform.classList.add("active");
        coreStatus.innerText = "正在進行語意運算中...";

        try {
          const response = await fetch("http://localhost:3001/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });

          if (!response.ok) {
            throw new Error("伺服器回應異常");
          }

          const data = await response.json();
          chatBox.innerHTML += `<div class="message friday"><strong>F.R.I.D.A.Y.：</strong> ${data.reply}</div>`;
        } catch (error) {
          chatBox.innerHTML += `<div class="message friday" style="color: #ff5555;"><strong>F.R.I.D.A.Y.：</strong> 連線錯誤：無法聯繫後端伺服器。</div>`;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
        coreStatus.innerText = "核心待命：等待語音或指令輸入...";
        waveform.classList.remove("active");
      }
    </script>
  </body>
</html>
